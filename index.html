<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 - Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tasks-page">

    <section class="task-section">
        <h2>Task 1: Toolbar Layout (Row, Justify-content, Align-items)</h2>

        <div class="toolbar">
            <input type="text" placeholder="Search products...">
            <button class="add-item">+ Add New Item</button>
        </div>
    </section>

    <section class="task-section">
        <h2>Task 2: Responsive Filter Tags (Flex-wrap & Align-content)</h2>

        <div class="filter-container">
            <span class="filter-tag">Electronics</span>
            <span class="filter-tag">Apparel</span>
            <span class="filter-tag">Home & Kitchen</span>
            <span class="filter-tag">Books</span>
            <span class="filter-tag">Sports</span>
            <span class="filter-tag">PCs</span>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPortal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portfolio-page">

    <header class="navbar">
        <h1>DevPortal</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </nav>
    </header>

    <main class="dashboard">

        <section class="profile-card">
            <span class="online-status"></span>

            <div class="avatar">IMG</div>

            <h2>Houssein Droubi</h2>
            <p class="job-title">Full-Stack Developer</p>

            <div class="profile-stats">
                <div>
                    <strong>12</strong>
                    <span>Projects</span>
                </div>

                <div>
                    <strong>850</strong>
                    <span>Commits</span>
                </div>
            </div>
        </section>

        <section class="projects-card">
            <h2>Active Projects</h2>

            <div class="project">
                <div>
                    <h3>E-Commerce Redesign</h3>
                    <p>Updated 2 hours ago</p>
                </div>

                <span class="status in-progress">In Progress</span>
            </div>

            <div class="project">
                <div>
                    <h3>Portfolio Template</h3>
                    <p>Updated yesterday</p>
                </div>

                <span class="status completed">Completed</span>
            </div>
        </section>

    </main>

</body>
</html>
